[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ledger-kit"
version = "0.3.2"
description = "Tiny flat-layout ledger CLI used as an external verification fixture"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ledger = "ledgerkit.cli:main"

[tool.pytest.ini_options]
testpaths = ["spec"]
